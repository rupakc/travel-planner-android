org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# R8 full mode is the AGP default since 8.0; stated explicitly so it is never turned off by accident.
android.enableR8.fullMode=true
# Firebase is optional: the google-services plugin is applied only when app/google-services.json exists.

# Production server (GCP e2-micro VM; free sslip.io name until a custom domain is set).
# The web app and API share this origin, so share links use it too.
PROD_BASE_URL=https://35-207-18-35.sslip.io
WEB_BASE_URL=https://35-207-18-35.sslip.io

# KSP incremental processing is off (KSP 2.3.13 is KSP2-only; its KspAATask reads `ksp.incremental`, an @Input of the
# task). Defence in depth only: the incomplete KSP outputs that broke a release APK come from KSP tasks running
# concurrently, which build-logic `configureKspSafety` prevents (KSP tasks serialized and never build-cached).
# Measured cost of this flag: within noise. Refs: kotlinlang.org/docs/ksp-incremental.html, google/ksp#2252.
ksp.incremental=false
