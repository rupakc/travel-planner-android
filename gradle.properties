org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# R8 full mode is the AGP default since 8.0; stated explicitly so it is never turned off by accident.
android.enableR8.fullMode=true
# Firebase is optional: the google-services plugin is applied only when app/google-services.json exists.

# Production server (GCP e2-micro VM; free sslip.io name until a custom domain is set).
# The web app and API share this origin, so share links use it too.
PROD_BASE_URL=https://35-207-18-35.sslip.io
WEB_BASE_URL=https://35-207-18-35.sslip.io

# KSP incremental processing is off. KSP 2.3.13 (KSP2 only; the KspAATask reads `ksp.incremental`) once left a stale
# localRelease output for :feature:alerts that dropped NotificationBellViewModel/NotificationsViewModel from Hilt's
# aggregated deps; the APK built and crashed on the home screen. `incremental` is an @Input of the KSP task, so with it
# false every build-cache entry comes from a full run (older entries made by incremental runs are no longer hit).
# Refs: kotlinlang.org/docs/ksp-incremental.html, google/ksp#2252, google/dagger#4181. Guard: verifyHiltViewModels<Variant>.
ksp.incremental=false
