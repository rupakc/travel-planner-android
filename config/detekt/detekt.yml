# Built on detekt's default config (buildUponDefaultConfig = true). No baseline:
# fix findings or suppress them in code with a reason.
config:
  validation: true

complexity:
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 12
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  LongMethod:
    threshold: 80
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    thresholdInFiles: 30
    thresholdInClasses: 30
    thresholdInInterfaces: 30
    thresholdInObjects: 30
    ignorePrivate: true
  CyclomaticComplexMethod:
    threshold: 20
    ignoreSimpleWhenEntries: true
  LargeClass:
    threshold: 800

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
  MatchingDeclarationName:
    active: false
  ConstructorParameterNaming:
    privateParameterPattern: '[a-z][A-Za-z0-9]*'

style:
  MagicNumber:
    excludes: ['**/test/**', '**/designsystem/**', '**/model/**', '**/*Fixtures*.kt', '**/*.kts']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: ['Composable', 'Preview']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  ForbiddenComment:
    active: false
  ReturnCount:
    max: 4
    excludeGuardClauses: true
  MaxLineLength:
    maxLineLength: 140
  WildcardImport:
    active: true
  DestructuringDeclarationWithTooManyEntries:
    maxDestructuringEntries: 4
  UseCheckOrError:
    active: true
  UnnecessaryAbstractClass:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: true
    exceptionNames:
      - Error
      - Throwable
  SwallowedException:
    ignoredExceptionTypes:
      - CancellationException
      - InterruptedException
      - NumberFormatException
      - ParseException
      - MalformedURLException
      - SerializationException
      - IllegalArgumentException
      - DateTimeParseException
