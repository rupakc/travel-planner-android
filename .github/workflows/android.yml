name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual release from main (the release jobs below only run on main, after the full build job passes).
  workflow_dispatch:

# Security S-M4: read-only by default; only the two publishing jobs get a write scope (contents / packages).
permissions:
  contents: read

# PR runs cancel superseded ones; main runs queue instead, so two pushes never race the same release.
env:
  # Expected signer of every published APK (the Voyager upload key). A mismatch fails the publishing jobs.
  EXPECTED_CERT_SHA256: "1C:B8:29:4D:D5:7B:8D:E7:7D:B2:77:99:F3:1A:86:3C:F8:97:56:D1:CC:E6:02:34:C8:E5:85:50:6E:1E:38:B0"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check documentation links
        run: scripts/check-doc-links.sh

      - name: Read the pinned web commit
        id: web-pin
        run: echo "sha=$(sed -n 's/^web\.sha=//p' config/web-source.properties)" >> "$GITHUB_OUTPUT"

      - name: Check out the pinned web commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rupakc/travel-planner
          ref: ${{ steps.web-pin.outputs.sha }}
          path: .web-source
          persist-credentials: false
          sparse-checkout: |
            frontend/design/tokens.json
            frontend/src/i18n/locales

      - name: Check generated tokens and strings against the pinned web commit
        run: scripts/check-web-sync.sh .web-source

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      # Every action is pinned by commit SHA (the comment is the release tag); Dependabot proposes grouped updates weekly.
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;android-36 platforms;android-37.0 build-tools;36.0.0"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # setup-gradle v6 caching (default "enhanced" provider) is a proprietary Gradle component: the repo owner
          # accepts the Gradle Terms of Use for it. These inputs record that and mute the licence notice; they do not
          # publish build scans (that needs build-scan-publish: true, which stays off).
          build-scan-terms-of-use-url: https://gradle.com/help/legal-terms-of-use
          build-scan-terms-of-use-agree: "yes"

      # No google-services.json in CI: FCM stays inert (spec §7).
      # assembleProdRelease is signed with the debug key for CI only (docs/Release.md); never publish it.
      # assembleProdRelease also runs :app:verifyHiltViewModelsProdRelease (every @HiltViewModel bound by Hilt and in the R8 dex).
      - name: Verify
        run: ./gradlew spotlessCheck detekt lintLocalDebug testLocalDebugUnitTest assembleLocalDebug assembleProdRelease :build-logic:convention:test --stacktrace

      # Review M8: R8 must not strip kotlinx.serialization models that Retrofit reaches reflectively.
      - name: Check release keep rules
        run: ./gradlew :app:verifyReleaseKeepRules

      - name: Release script tests
        run: scripts/tests/test-release-scripts.sh

      - name: Upload APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk
          retention-days: 7

      # The release path without secrets (throwaway key, dummy google-services.json): clean unsigned build with Firebase
      # applied, apksigner v2+v3 signing, signature/version verification. A broken release config fails before merge.
      # Runs after "Upload APKs" because it cleans the build.
      - name: Release config check (no secrets)
        run: scripts/ci-release-config-check.sh --stacktrace

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  # Publishing: main only, after `build` (every check) passed. The three jobs run in the `release` environment
  # (deployment branch policy: main only). Order: signed APK -> GHCR -> GitHub Release, so the notes only advertise
  # `oras pull` when the push worked. "latest" (Release) and ":latest" (GHCR) move only when this run's commit is still
  # the tip of main and its versionCode beats everything already published (scripts/release-decision.sh), so re-running
  # an older run can never move them backwards. Every job is safe to re-run.
  release-apk:
    name: Signed release APK
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
    outputs:
      version-name: ${{ steps.version.outputs.name }}
      version-code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and history for the release notes

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;android-36 platforms;android-37.0 build-tools;36.0.0"

      # Dependency cache only (read-only); the release build itself runs clean with --no-build-cache --rerun-tasks.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
          # setup-gradle v6 caching (default "enhanced" provider) is a proprietary Gradle component: the repo owner
          # accepts the Gradle Terms of Use for it. These inputs record that and mute the licence notice; they do not
          # publish build scans (that needs build-scan-publish: true, which stays off).
          build-scan-terms-of-use-url: https://gradle.com/help/legal-terms-of-use
          build-scan-terms-of-use-agree: "yes"

      # versionCode must grow with every published build (Android refuses downgrades); 100 + run number > today's 1.
      - name: Version
        id: version
        run: |
          echo "name=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      # Optional: with google-services.json push notifications work; without it FCM stays inert (said in the notes).
      - name: Firebase config (optional)
        id: firebase
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [[ -n "$GOOGLE_SERVICES_JSON_BASE64" ]]; then
            umask 077
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            echo "fcm=enabled" >> "$GITHUB_OUTPUT"
          else
            echo "fcm=inert" >> "$GITHUB_OUTPUT"
          fi

      # Unsigned: Gradle never sees the key or its password. Clean, --no-build-cache --rerun-tasks, Hilt guard, keep rules.
      - name: Build unsigned release APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: >-
          scripts/build-release-apk.sh --stacktrace
          -PVOYAGER_UNSIGNED_RELEASE=true
          -PVOYAGER_VERSION_CODE="$VERSION_CODE"
          -PVOYAGER_VERSION_NAME="$VERSION_NAME"

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.VOYAGER_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::VOYAGER_KEYSTORE_BASE64 is not set; refusing to publish an unsigned or debug-signed APK."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/voyager-release.p12"
          chmod 600 "$RUNNER_TEMP/voyager-release.p12"

      # The only step that receives the key password (apksigner reads it from the environment by name).
      - name: Sign (apksigner, v2 + v3)
        env:
          VOYAGER_KEYSTORE_FILE: ${{ runner.temp }}/voyager-release.p12
          VOYAGER_KEYSTORE_PASSWORD: ${{ secrets.VOYAGER_KEYSTORE_PASSWORD }}
          VOYAGER_KEY_ALIAS: ${{ secrets.VOYAGER_KEY_ALIAS }}
        run: scripts/sign-release-apk.sh app/build/outputs/apk/prod/release/app-prod-release-unsigned.apk "$RUNNER_TEMP/Voyager-signed.apk"

      - name: Remove signing key and Firebase config
        if: always()
        run: rm -f "$RUNNER_TEMP/voyager-release.p12" app/google-services.json

      - name: Verify signature and version
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: scripts/verify-apk.sh "$RUNNER_TEMP/Voyager-signed.apk" "$EXPECTED_CERT_SHA256" "$VERSION_CODE" "$VERSION_NAME"

      - name: Package and release notes
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          FCM: ${{ steps.firebase.outputs.fcm }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          mkdir -p dist
          cp "$RUNNER_TEMP/Voyager-signed.apk" "dist/Voyager-$VERSION_NAME.apk"
          (cd dist && sha256sum "Voyager-$VERSION_NAME.apk" > "Voyager-$VERSION_NAME.apk.sha256")
          cat "dist/Voyager-$VERSION_NAME.apk.sha256"
          # Excluding this run's own tag: on a re-run it already points at HEAD and would empty the change list.
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'android-v*' --exclude "android-v$VERSION_NAME" HEAD 2>/dev/null || true)
          APK_SHA256=$(cut -d' ' -f1 "dist/Voyager-$VERSION_NAME.apk.sha256")
          export PREV_TAG APK_SHA256 CERT_SHA256="$EXPECTED_CERT_SHA256"
          scripts/release-notes.sh > dist/notes.md
          cat dist/notes.md

      - name: Upload release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voyager-release-apk
          path: dist/
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  # The APK as an OCI artifact on GHCR (linked to this repo's Packages): always :<versionName>; :latest only when
  # scripts/release-decision.sh says so (also comparing with the versionCode annotation on the current :latest).
  ghcr:
    name: Push APK to GHCR
    needs: release-apk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      packages: write
    env:
      ORAS_VERSION: "1.3.6"
      ORAS_SHA256: "66fb0ad7206f3f6fa77ed5b552049d364ccf4b50b1684554f731f76302b52ca0" # oras_1.3.6_linux_amd64.tar.gz
      IMAGE: ghcr.io/rupakc/voyager-android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: voyager-release-apk
          path: dist

      # Re-check what was downloaded before publishing it (runner's preinstalled Android SDK).
      - name: Verify downloaded APK
        env:
          VERSION_NAME: ${{ needs.release-apk.outputs.version-name }}
          VERSION_CODE: ${{ needs.release-apk.outputs.version-code }}
        run: |
          (cd dist && sha256sum --check --strict "Voyager-$VERSION_NAME.apk.sha256")
          scripts/verify-apk.sh "dist/Voyager-$VERSION_NAME.apk" "$EXPECTED_CERT_SHA256" "$VERSION_CODE" "$VERSION_NAME"

      - name: Install oras
        run: |
          curl -fsSLo "$RUNNER_TEMP/oras.tar.gz" "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          echo "$ORAS_SHA256  $RUNNER_TEMP/oras.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/oras"
          tar -xzf "$RUNNER_TEMP/oras.tar.gz" -C "$RUNNER_TEMP/oras" oras
          echo "$RUNNER_TEMP/oras" >> "$GITHUB_PATH"

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$GITHUB_TOKEN"

      - name: Decide :latest
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ needs.release-apk.outputs.version-name }}
          VERSION_CODE: ${{ needs.release-apk.outputs.version-code }}
        run: |
          # API failures fail the step (never default to "latest").
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          bodies=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name != \"android-v$VERSION_NAME\") | .body")
          codes=$(sed -nE 's/^<!-- voyager-version-code: ([0-9]+) -->\r?$/\1/p' <<<"$bodies")
          # The current :latest: "not found" (first push) is fine; any other error fails closed.
          if manifest=$(oras manifest fetch "$IMAGE:latest" 2>"$RUNNER_TEMP/oras.err"); then
            codes+=$'\n'$(jq -r '.annotations["io.github.rupakc.voyager.version-code"] // empty' <<<"$manifest")
          elif grep -qiE ': not found$|manifest unknown|name unknown' "$RUNNER_TEMP/oras.err"; then
            echo "No $IMAGE:latest yet."
          else
            cat "$RUNNER_TEMP/oras.err" >&2
            echo "::error::Could not read $IMAGE:latest; not moving :latest."
            exit 1
          fi
          mapfile -t published < <(grep -E '^[0-9]+$' <<<"$codes" || true)
          latest=$(scripts/release-decision.sh "$GITHUB_SHA" "$head" "$VERSION_CODE" "${published[@]}")
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Push
        env:
          VERSION_NAME: ${{ needs.release-apk.outputs.version-name }}
          VERSION_CODE: ${{ needs.release-apk.outputs.version-code }}
          LATEST: ${{ steps.decide.outputs.latest }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          tags=$VERSION_NAME
          if [[ "$LATEST" == true ]]; then tags="$tags,latest"; fi
          cd dist
          oras push "$IMAGE:$tags" \
            --artifact-type application/vnd.android.package-archive \
            --annotation "org.opencontainers.image.source=$REPO_URL" \
            --annotation "org.opencontainers.image.url=$REPO_URL/releases/tag/android-v$VERSION_NAME" \
            --annotation "org.opencontainers.image.title=Voyager $VERSION_NAME" \
            --annotation "org.opencontainers.image.description=Voyager (Travel Planner) Android APK, signed release build" \
            --annotation "org.opencontainers.image.version=$VERSION_NAME" \
            --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "org.opencontainers.image.licenses=MIT" \
            --annotation "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --annotation "io.github.rupakc.voyager.version-code=$VERSION_CODE" \
            "Voyager-$VERSION_NAME.apk:application/vnd.android.package-archive" \
            "Voyager-$VERSION_NAME.apk.sha256:text/plain"
          echo "Pushed $IMAGE:$tags"

      - name: Log out
        if: always()
        run: rm -f "$HOME/.docker/config.json"

  # GitHub Release android-v<versionName> with the APK + .sha256. Runs even if the GHCR push failed (the notes then do
  # not mention GHCR). Idempotent: re-running for the same commit updates assets and notes; a tag on another commit fails.
  github-release:
    name: GitHub Release
    needs: [release-apk, ghcr]
    if: always() && needs.release-apk.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: voyager-release-apk
          path: dist

      # Re-check what was downloaded before publishing it (runner's preinstalled Android SDK).
      - name: Verify downloaded APK
        env:
          VERSION_NAME: ${{ needs.release-apk.outputs.version-name }}
          VERSION_CODE: ${{ needs.release-apk.outputs.version-code }}
        run: |
          (cd dist && sha256sum --check --strict "Voyager-$VERSION_NAME.apk.sha256")
          scripts/verify-apk.sh "dist/Voyager-$VERSION_NAME.apk" "$EXPECTED_CERT_SHA256" "$VERSION_CODE" "$VERSION_NAME"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ needs.release-apk.outputs.version-name }}
          VERSION_CODE: ${{ needs.release-apk.outputs.version-code }}
          GHCR_RESULT: ${{ needs.ghcr.result }}
        run: |
          tag="android-v$VERSION_NAME"
          if [[ "$GHCR_RESULT" == success ]]; then
            ghcr_line="- Also on GHCR: \`oras pull ghcr.io/rupakc/voyager-android:$VERSION_NAME\`"
            awk -v line="$ghcr_line" '{print} /^- Signer certificate SHA-256:/{print line}' dist/notes.md > dist/notes.final.md
          else
            cp dist/notes.md dist/notes.final.md
          fi

          # API failures fail the step (never default to "latest").
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          bodies=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name != \"$tag\") | .body")
          mapfile -t published < <(sed -nE 's/^<!-- voyager-version-code: ([0-9]+) -->\r?$/\1/p' <<<"$bodies")
          latest=$(scripts/release-decision.sh "$GITHUB_SHA" "$head" "$VERSION_CODE" "${published[@]}")

          assets=("dist/Voyager-$VERSION_NAME.apk" "dist/Voyager-$VERSION_NAME.apk.sha256")
          # The tag's commit: 404 means no tag yet; any other API error fails (never reuse a tag blindly).
          tag_sha=
          if ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2>"$RUNNER_TEMP/gh.err"); then
            tag_sha=$(jq -r .object.sha <<<"$ref")
            if [[ "$(jq -r .object.type <<<"$ref")" == tag ]]; then # annotated tag: dereference
              tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq .object.sha)
            fi
          elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/gh.err"; then
            cat "$RUNNER_TEMP/gh.err" >&2
            echo "::error::Could not check whether tag $tag exists; refusing to publish."
            exit 1
          fi
          if [[ -n "$tag_sha" ]]; then
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $tag already exists on $tag_sha, not on this run's commit $GITHUB_SHA; refusing to publish."
              exit 1
            fi
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $tag exists for this commit: replacing assets and notes (re-run)."
              gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
              edit=(--notes-file dist/notes.final.md --title "Voyager $VERSION_NAME")
              if [[ "$latest" == true ]]; then edit+=(--latest); fi
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" "${edit[@]}"
              exit 0
            fi
          fi
          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Voyager $VERSION_NAME" --notes-file dist/notes.final.md --latest="$latest"
