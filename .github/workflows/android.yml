name: Android CI

on:
  push:
    branches: [main]
  pull_request:

# Security S-M4: the build only reads the repository; nothing in CI needs a write token.
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check documentation links
        run: scripts/check-doc-links.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3 (third-party: pinned by SHA)
        with:
          packages: "platform-tools platforms;android-36 platforms;android-37.0 build-tools;36.0.0"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4 (third-party: pinned by SHA)

      # No google-services.json in CI: FCM stays inert (spec §7).
      # assembleProdRelease is signed with the debug key for CI only (docs/Release.md); never publish it.
      - name: Verify
        run: ./gradlew spotlessCheck detekt lintLocalDebug testLocalDebugUnitTest assembleLocalDebug assembleProdRelease --stacktrace

      # Review M8: R8 must not strip kotlinx.serialization models that Retrofit reaches reflectively.
      - name: Check release keep rules
        run: ./gradlew :app:verifyReleaseKeepRules

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk
          retention-days: 7
