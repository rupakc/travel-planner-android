name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual release from main (the release jobs below only run on main, after the full build job passes).
  workflow_dispatch:

# Security S-M4: read-only by default; only the two publishing jobs get a write scope (contents / packages).
permissions:
  contents: read

# PR runs cancel superseded ones; main runs queue instead, so two pushes never race the same release.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check documentation links
        run: scripts/check-doc-links.sh

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      # Third-party actions are pinned by commit SHA (the comment is the release tag); Dependabot proposes updates weekly.
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platform-tools platforms;android-36 platforms;android-37.0 build-tools;36.0.0"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # No google-services.json in CI: FCM stays inert (spec §7).
      # assembleProdRelease is signed with the debug key for CI only (docs/Release.md); never publish it.
      # assembleProdRelease also runs :app:verifyHiltViewModelsProdRelease (every @HiltViewModel bound by Hilt and in the R8 dex).
      - name: Verify
        run: ./gradlew spotlessCheck detekt lintLocalDebug testLocalDebugUnitTest assembleLocalDebug assembleProdRelease :build-logic:convention:test --stacktrace

      # Review M8: R8 must not strip kotlinx.serialization models that Retrofit reaches reflectively.
      - name: Check release keep rules
        run: ./gradlew :app:verifyReleaseKeepRules

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

      - name: Upload APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk
          retention-days: 7

  # Signed release APK: main only, after `build` (every check) passed. Never publishes a debug-signed or unverified APK.
  release-apk:
    name: Signed release APK
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version-name: ${{ steps.version.outputs.name }}
    env:
      # Expected signer of every published APK (the Voyager upload key). A mismatch fails the job.
      EXPECTED_CERT_SHA256: "1C:B8:29:4D:D5:7B:8D:E7:7D:B2:77:99:F3:1A:86:3C:F8:97:56:D1:CC:E6:02:34:C8:E5:85:50:6E:1E:38:B0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # tags and history for the release notes

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platform-tools platforms;android-36 platforms;android-37.0 build-tools;36.0.0"

      # Dependency cache only (read-only); the release build itself runs with --no-build-cache after a clean.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: true

      # versionCode must grow with every published build (Android refuses downgrades); 100 + run number > today's 1.
      - name: Version
        id: version
        run: |
          echo "name=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.VOYAGER_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::VOYAGER_KEYSTORE_BASE64 is not set; refusing to publish a debug-signed APK."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/voyager-release.p12"
          chmod 600 "$RUNNER_TEMP/voyager-release.p12"
          echo "VOYAGER_KEYSTORE_FILE=$RUNNER_TEMP/voyager-release.p12" >> "$GITHUB_ENV"

      # Optional: with google-services.json push notifications work; without it FCM stays inert (said in the notes).
      - name: Firebase config (optional)
        id: firebase
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [[ -n "$GOOGLE_SERVICES_JSON_BASE64" ]]; then
            umask 077
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            echo "fcm=enabled" >> "$GITHUB_OUTPUT"
          else
            echo "fcm=inert" >> "$GITHUB_OUTPUT"
          fi

      # Clean, --no-build-cache assembleProdRelease + verifyHiltViewModelsProdRelease + verifyReleaseKeepRules.
      - name: Build release APK
        env:
          VOYAGER_KEYSTORE_PASSWORD: ${{ secrets.VOYAGER_KEYSTORE_PASSWORD }}
          VOYAGER_KEY_ALIAS: ${{ secrets.VOYAGER_KEY_ALIAS }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: >-
          scripts/build-release-apk.sh --stacktrace
          -PVOYAGER_REQUIRE_RELEASE_SIGNING=true
          -PVOYAGER_VERSION_CODE="$VERSION_CODE"
          -PVOYAGER_VERSION_NAME="$VERSION_NAME"

      - name: Verify signature and package
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          apk=app/build/outputs/apk/prod/release/app-prod-release.apk
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$apksigner" verify --verbose "$apk"
          certs=$("$apksigner" verify --print-certs "$apk")
          signers=$(grep -c '^Signer #[0-9]* certificate SHA-256 digest:' <<<"$certs")
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<<"$certs" | tr '[:lower:]' '[:upper:]')
          expected=$(tr -d ':' <<<"$EXPECTED_CERT_SHA256" | tr '[:lower:]' '[:upper:]')
          if [[ "$signers" != 1 || "$actual" != "$expected" ]]; then
            echo "::error::APK signer mismatch (signers: $signers, SHA-256: $actual); expected $EXPECTED_CERT_SHA256"
            exit 1
          fi
          grep -q "\"versionName\": \"$VERSION_NAME\"" app/build/outputs/apk/prod/release/output-metadata.json
          grep -q "\"versionCode\": $VERSION_CODE" app/build/outputs/apk/prod/release/output-metadata.json
          mkdir -p dist
          cp "$apk" "dist/Voyager-$VERSION_NAME.apk"
          (cd dist && sha256sum "Voyager-$VERSION_NAME.apk" > "Voyager-$VERSION_NAME.apk.sha256")
          cat "dist/Voyager-$VERSION_NAME.apk.sha256"

      - name: Release notes
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          FCM: ${{ steps.firebase.outputs.fcm }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'android-v*' HEAD 2>/dev/null || true)
          range=${prev:+$prev..}$GITHUB_SHA
          sha=$(cut -d' ' -f1 "dist/Voyager-$VERSION_NAME.apk.sha256")
          {
            echo "Voyager for Android $VERSION_NAME, built by CI from \`${GITHUB_SHA::12}\` after every check passed."
            echo
            echo "- APK: \`Voyager-$VERSION_NAME.apk\` (SHA-256 \`$sha\`)"
            echo "- Signer certificate SHA-256: \`$EXPECTED_CERT_SHA256\`"
            if [[ "$FCM" == enabled ]]; then
              echo "- Push notifications: enabled (Firebase configured)."
            else
              echo "- Push notifications: **inactive** in this build (no Firebase config); in-app alerts still work."
            fi
            echo "- Also on GHCR: \`oras pull ghcr.io/rupakc/voyager-android:$VERSION_NAME\`"
            echo
            if [[ -n "$prev" ]]; then
              echo "## Changes since $prev ([compare]($REPO_URL/compare/$prev...$GITHUB_SHA))"
            else
              echo "## Changes (first release)"
            fi
            echo
            git log --no-merges --pretty='- %s (%h)' "$range" | head -n 200
          } > dist/notes.md
          cat dist/notes.md

      - name: Remove signing key and Firebase config
        if: always()
        run: rm -f "$RUNNER_TEMP/voyager-release.p12" app/google-services.json

      - name: Upload release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: voyager-release-apk
          path: dist/
          if-no-files-found: error
          retention-days: 90

  # GitHub Release android-v<versionName> with the APK + .sha256, marked latest.
  github-release:
    name: GitHub Release
    needs: release-apk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: voyager-release-apk
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ needs.release-apk.outputs.version-name }}
        run: >-
          gh release create "android-v$VERSION_NAME"
          "dist/Voyager-$VERSION_NAME.apk" "dist/Voyager-$VERSION_NAME.apk.sha256"
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "Voyager $VERSION_NAME" --notes-file dist/notes.md --latest

  # The same APK as an OCI artifact on GHCR (linked to this repo's Packages): :<versionName> and :latest.
  ghcr:
    name: Push APK to GHCR
    needs: [release-apk, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    env:
      ORAS_VERSION: "1.3.6"
      ORAS_SHA256: "66fb0ad7206f3f6fa77ed5b552049d364ccf4b50b1684554f731f76302b52ca0" # oras_1.3.6_linux_amd64.tar.gz
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: voyager-release-apk
          path: dist

      - name: Install oras
        run: |
          curl -fsSLo "$RUNNER_TEMP/oras.tar.gz" "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          echo "$ORAS_SHA256  $RUNNER_TEMP/oras.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/oras"
          tar -xzf "$RUNNER_TEMP/oras.tar.gz" -C "$RUNNER_TEMP/oras" oras
          echo "$RUNNER_TEMP/oras" >> "$GITHUB_PATH"

      - name: Push
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ needs.release-apk.outputs.version-name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$GITHUB_TOKEN"
          cd dist
          oras push "ghcr.io/rupakc/voyager-android:$VERSION_NAME,latest" \
            --artifact-type application/vnd.android.package-archive \
            --annotation "org.opencontainers.image.source=$REPO_URL" \
            --annotation "org.opencontainers.image.url=$REPO_URL/releases/tag/android-v$VERSION_NAME" \
            --annotation "org.opencontainers.image.title=Voyager $VERSION_NAME" \
            --annotation "org.opencontainers.image.description=Voyager (Travel Planner) Android APK, signed release build" \
            --annotation "org.opencontainers.image.version=$VERSION_NAME" \
            --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "org.opencontainers.image.licenses=MIT" \
            --annotation "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "Voyager-$VERSION_NAME.apk:application/vnd.android.package-archive" \
            "Voyager-$VERSION_NAME.apk.sha256:text/plain"

      - name: Log out
        if: always()
        run: rm -f "$HOME/.docker/config.json"
